spring:
  application:
    name: tax-credit-payment-allocation
  
  datasource:
    url: jdbc:h2:mem:taxcreditdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.taxcredit: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

